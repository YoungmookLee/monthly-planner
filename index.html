<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      min-width: 220px;
      text-align: center;
    }

    header button {
      background: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s;
    }

    header button:hover { background: #e8e8e8; }

    .calendar {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #4f46e5;
      color: #fff;
    }

    .day-headers span {
      padding: 10px 0;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-left: 1px solid #e5e5e5;
      border-top: 1px solid #e5e5e5;
    }

    .cell {
      border-right: 1px solid #e5e5e5;
      border-bottom: 1px solid #e5e5e5;
      min-height: 110px;
      padding: 6px;
      background: #fff;
      position: relative;
    }

    .cell.other-month { background: #fafafa; }

    .cell.today .date-num {
      background: #4f46e5;
      color: #fff;
      border-radius: 50%;
    }

    .date-num {
      font-size: 0.8rem;
      font-weight: 600;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      color: #555;
    }

    .cell.other-month .date-num { color: #bbb; }

    .events { display: flex; flex-direction: column; gap: 2px; }

    .event {
      font-size: 0.72rem;
      background: #ede9fe;
      color: #4338ca;
      border-radius: 3px;
      padding: 2px 5px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .event:hover { background: #ddd6fe; }

    .event .del {
      font-size: 0.65rem;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .add-btn {
      position: absolute;
      bottom: 4px;
      right: 6px;
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0;
    }

    .add-btn:hover { color: #4f46e5; }

    /* Modal */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .modal h2 { font-size: 1rem; margin-bottom: 14px; }

    .modal input[type="text"] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
      margin-bottom: 14px;
      outline: none;
    }

    .modal input[type="text"]:focus { border-color: #4f46e5; }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .modal-actions button {
      padding: 7px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-cancel { background: #f0f0f0; }
    .btn-cancel:hover { background: #e0e0e0; }
    .btn-save { background: #4f46e5; color: #fff; }
    .btn-save:hover { background: #4338ca; }
  </style>
</head>
<body>

<header>
  <button id="prev">&#8249;</button>
  <h1 id="month-label"></h1>
  <button id="next">&#8250;</button>
</header>

<div class="calendar">
  <div class="day-headers">
    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
    <span>Thu</span><span>Fri</span><span>Sat</span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">Add event</h2>
    <input type="text" id="event-input" placeholder="Event title" maxlength="80" />
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-save" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  let current = new Date();
  let viewYear = current.getFullYear();
  let viewMonth = current.getMonth();

  // events: { "YYYY-MM-DD": ["event1", "event2", ...] }
  let events = JSON.parse(localStorage.getItem('planner-events') || '{}');

  function saveEvents() {
    localStorage.setItem('planner-events', JSON.stringify(events));
  }

  function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function render() {
    document.getElementById('month-label').textContent =
      `${MONTHS[viewMonth]} ${viewYear}`;

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

    const todayKey = dateKey(current.getFullYear(), current.getMonth(), current.getDate());

    const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

    for (let i = 0; i < totalCells; i++) {
      let day, month, year, other = false;

      if (i < firstDay) {
        day = daysInPrev - firstDay + 1 + i;
        month = viewMonth - 1;
        year = viewYear;
        if (month < 0) { month = 11; year--; }
        other = true;
      } else if (i >= firstDay + daysInMonth) {
        day = i - firstDay - daysInMonth + 1;
        month = viewMonth + 1;
        year = viewYear;
        if (month > 11) { month = 0; year++; }
        other = true;
      } else {
        day = i - firstDay + 1;
        month = viewMonth;
        year = viewYear;
      }

      const key = dateKey(year, month, day);
      const isToday = key === todayKey;

      const cell = document.createElement('div');
      cell.className = 'cell' + (other ? ' other-month' : '') + (isToday ? ' today' : '');

      const num = document.createElement('div');
      num.className = 'date-num';
      num.textContent = day;
      cell.appendChild(num);

      const evList = document.createElement('div');
      evList.className = 'events';

      (events[key] || []).forEach((ev, idx) => {
        const tag = document.createElement('div');
        tag.className = 'event';
        const label = document.createElement('span');
        label.textContent = ev;
        const del = document.createElement('span');
        del.className = 'del';
        del.textContent = '✕';
        del.title = 'Remove';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          events[key].splice(idx, 1);
          if (!events[key].length) delete events[key];
          saveEvents();
          render();
        });
        tag.appendChild(label);
        tag.appendChild(del);
        evList.appendChild(tag);
      });

      cell.appendChild(evList);

      const addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = '+';
      addBtn.title = 'Add event';
      addBtn.addEventListener('click', () => openModal(key, year, month, day));
      cell.appendChild(addBtn);

      grid.appendChild(cell);
    }
  }

  // Modal logic
  let pendingKey = null;

  function openModal(key, y, m, d) {
    pendingKey = key;
    document.getElementById('modal-title').textContent =
      `Add event — ${MONTHS[m]} ${d}, ${y}`;
    document.getElementById('event-input').value = '';
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => document.getElementById('event-input').focus(), 50);
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    pendingKey = null;
  }

  function saveModal() {
    const val = document.getElementById('event-input').value.trim();
    if (val && pendingKey) {
      if (!events[pendingKey]) events[pendingKey] = [];
      events[pendingKey].push(val);
      saveEvents();
      render();
    }
    closeModal();
  }

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', saveModal);
  document.getElementById('event-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveModal();
    if (e.key === 'Escape') closeModal();
  });
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeModal();
  });

  document.getElementById('prev').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  });

  document.getElementById('next').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  });

  render();
</script>
</body>
</html>
